[application]
name = "AIFixParser"
default_platform = "desktop"

[bundle]
identifier = "com.aifixparser.app"
publisher = "aifixparser.com"
icon = ["assets/icon.icns", "assets/icon.ico"]
resources = []
copyright = "aifixparser.com"
short_description = "AI FIX Parser – Parse and analyze FIX protocol messages with AI-powered insights"

[bundle.macos]
minimum_system_version = "12.0"
entitlements = "entitlements.plist"
provider_short_name = "438CH4PXMR"
hardened_runtime = true
# Full identity disambiguates between the two certs sharing team id 438CH4PXMR:
#   - "3rd Party Mac Developer Application: …" (Mac App Store builds)
#   - "Developer ID Application: …"             (outside-App-Store distribution)
# We sign with Developer ID for direct downloads; switch to the 3rd Party cert
# only when building for MAS submission.
signing_identity = "Developer ID Application: Trung Huynh (438CH4PXMR)"

[bundle.windows]
icon_path = "assets/icon.ico"
webview_install_mode = "Skip"
