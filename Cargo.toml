[package]
name = "AiFIXParser"
version = "2.0.0"
edition = "2021"
description = "AI FIX Parser – Parse and analyze FIX protocol messages with AI-powered insights"
license = "aifixparser.com"

[[bin]]
name = "AiFIXParser"
path = "src/main.rs"

[[bin]]
name = "gen_fix"
path = "src/bin/gen_fix.rs"

[lib]
name = "aifixparser"
path = "src/lib.rs"

[features]
# Bypass license check during development — never enable in release builds.
dev = []

[dependencies]
compact_str = "0.8"
tokio = { version = "1", features = ["rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
memmap2 = "0.9"
memchr = "2"
dioxus = { version = "0.7.2", features = ["desktop"] }
dioxus-desktop = "0.7.2"
ico = "0.3"
rayon = "1.10"
rfd = "0.15"
tao = "0.34"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ---------------------------------------------------------------------------
# Platform-specific dependencies
# ---------------------------------------------------------------------------

# macOS – use the native cocoa/webkit backend (pulled in automatically by
# dioxus-desktop on macOS, nothing extra needed)

# Windows – link the Windows manifest so the app gets a proper icon & DPI
# awareness. winres is only needed at build time.
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.bench]
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3        # max speed (desktop app — binary size doesn't matter)
lto = true           # link-time optimisation
strip = true         # strip debug symbols
codegen-units = 1    # single codegen unit for better optimisation
panic = "abort"      # no unwinding machinery needed

