name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ─── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/dx/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock', 'Dioxus.toml') }}
          restore-keys: windows-cargo-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli --version "^0.7" -y

      - name: Build Windows bundle
        run: dx bundle --release --platform desktop

      - name: Locate NSIS installer
        id: find_exe
        shell: bash
        run: |
          EXE=$(find target/dx -path "*/nsis/*-setup.exe" | head -1)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiFixParser-windows
          path: ${{ steps.find_exe.outputs.path }}
          retention-days: 30

  # ─── Release (tags only) ──────────────────────────────────────────────────
  release:
    name: Attach to GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AiFixParser-windows
          path: release/

      - name: Rename and zip installer
        run: |
          EXE=$(find release -name "*-setup.exe" | head -1)
          cp "$EXE" AiFixParser-windows.exe
          zip AiFixParser-windows.zip AiFixParser-windows.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AiFixParser-windows.exe
            AiFixParser-windows.zip
