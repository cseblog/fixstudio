name: Build Windows

on:
  push:
    branches: [main, "feautre/**", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "^0.7" --locked

      - name: Build Windows bundle
        run: dx bundle --release --platform desktop

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIFixEngine-windows
          path: dist/
          retention-days: 30

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AIFixEngine-windows
          path: dist/

      - name: Compress bundle
        run: zip -r AIFixEngine-windows.zip dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AIFixEngine-windows.zip
