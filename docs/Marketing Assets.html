function AppIcon({ size = 512 }) {
  const uid = `ic${size}`;
  return (
    <svg width={size} height={size} viewBox="0 0 1000 1000"
      style={{ display:'block', borderRadius: size * 0.225 }}>
      <defs>
        <clipPath id={`${uid}clip`}>
          <rect width="1000" height="1000" rx="225"/>
        </clipPath>
        <radialGradient id={`${uid}bg`} cx="32%" cy="20%" r="75%">
          <stop offset="0%"   stopColor="#3a1f1f"/>
          <stop offset="50%"  stopColor="#1a0d0d"/>
          <stop offset="100%" stopColor="#090404"/>
        </radialGradient>
        <radialGradient id={`${uid}gbl`} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#9ec93d" stopOpacity="0.22"/>
          <stop offset="100%" stopColor="#9ec93d" stopOpacity="0"/>
        </radialGradient>
        <linearGradient id={`${uid}wg`} x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%"   stopColor="#d8f0b0"/>
          <stop offset="55%"  stopColor="#9ec93d"/>
          <stop offset="100%" stopColor="#6f9e25"/>
        </linearGradient>
        <linearGradient id={`${uid}shine`} x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stopColor="rgba(255,255,255,0.13)"/>
          <stop offset="45%"  stopColor="rgba(255,255,255,0.02)"/>
          <stop offset="100%" stopColor="rgba(0,0,0,0.08)"/>
        </linearGradient>
        <filter id={`${uid}glow`} x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="25" result="blur"/>
          <feFlood floodColor="#00d4ff" floodOpacity="0.55" result="col"/>
          <feComposite in="col" in2="blur" operator="in" result="glw"/>
          <feMerge><feMergeNode in="glw"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id={`${uid}softglow`} x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="40" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g clipPath={`url(#${uid}clip)`}>
        {/* BG */}
        <rect width="1000" height="1000" fill={`url(#${uid}bg)`}/>

        {/* Subtle grid */}
        {Array.from({length:18},(_,i)=>(
          <line key={`h${i}`} x1="0" y1={i*60} x2="1000" y2={i*60}
            stroke="rgba(255,255,255,0.022)" strokeWidth="1"/>
        ))}
        {Array.from({length:18},(_,i)=>(
          <line key={`v${i}`} x1={i*60} y1="0" x2={i*60} y2="1000"
            stroke="rgba(255,255,255,0.022)" strokeWidth="1"/>
        ))}

        {/* Glow blob behind wrench */}
        <ellipse cx="430" cy="440" rx="320" ry="320"
          fill={`url(#${uid}gbl)`} filter={`url(#${uid}softglow)`}/>

        {/* Background FIX tags — ghosted */}
        <text x="60"  y="185" fontFamily={MONO} fontSize="30" fill="#00d4ff" opacity="0.11" fontWeight="700">8=FIX.4.4</text>
        <text x="580" y="138" fontFamily={MONO} fontSize="26" fill="#a855f7" opacity="0.09">35=D</text>
        <text x="60"  y="830" fontFamily={MONO} fontSize="24" fill="#60a5fa" opacity="0.09">49=CITIFX</text>
        <text x="580" y="880" fontFamily={MONO} fontSize="24" fill="#22c55e" opacity="0.09">54=1 BUY</text>
        <text x="700" y="500" fontFamily={MONO} fontSize="22" fill="#00d4ff" opacity="0.07">100ms</text>

        {/* Wrench — tilted -32° around center 500,500 */}
        <g transform="rotate(-32, 500, 500)" filter={`url(#${uid}glow)`}>
          {/*
            Open-end wrench path (in 1000×1000 space, before rotation):
            Head: wide bar at top (y=140..300), with jaw notch cut from left (x=265..420, y=185..255)
            Handle: narrow bar (x=445..555, y=300..870) with rounded bottom
          */}
          <path
            fillRule="evenodd"
            d="
              M 265,140 L 735,140 L 735,300
              L 555,300 L 555,870
              Q 500,920 445,870
              L 445,300 L 265,300
              L 265,255 L 420,255 L 420,185 L 265,185
              Z
            "
            fill={`url(#${uid}wg)`}
          />
        </g>

        {/* "35=D" text positioned inside the jaw (rotated with wrench) */}
        <g transform="rotate(-32, 500, 500)">
          <text x="275" y="242" fontFamily={MONO} fontSize="34"
            fill="#00d4ff" fontWeight="700" opacity="0.85">35=D</text>
        </g>

        {/* Top shine overlay */}
        <rect width="1000" height="1000" fill={`url(#${uid}shine)`}/>

        {/* Bottom-edge vignette */}
        <rect y="650" width="1000" height="350"
          fill="url(#bottomvig)" opacity="1"/>
        <defs>
          <linearGradient id="bottomvig" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="rgba(0,0,0,0)"/>
            <stop offset="100%" stopColor="rgba(0,0,0,0.35)"/>
          </linearGradient>
        </defs>
      </g>
    </svg>
  );
}

/* ── Shared message list ── */
function MsgList({ sel, onSel, slim = false }) {

      borderRight:'1px solid rgba(255,255,255,0.06)', flexShrink:0 }}>
      {/* Headers */}

        fontSize:10, color:DIM, fontFamily:SANS, flexShrink:0 }}>
        <div style={{ width:slim?0:115, display:slim?'none':'block' }}>Time</div>
        {!slim && <div style={{ width:62 }}>Sender</div>}
        {!slim && <div style={{ width:62 }}>Target</div>}
        <div style={{ flex:1 }}>Message</div>
        <div style={{ width:110 }}>ID / Detail</div>
      </div>
      {/* Rows */}
      <div style={{ flex:1, overflowY:'auto' }}>
        {MSGS.slice(0,slim?16:14).map((msg,i)=>(
          <div key={i} onClick={()=>onSel(i)} style={{
            display:'flex', alignItems:'center', padding:'3px 8px', cursor:'pointer',
            background:sel===i?'rgba(0,212,255,0.055)':i%2===0?'transparent':'rgba(255,255,255,0.013)',
            borderLeft:sel===i?`2px solid ${CYAN}`:'2px solid transparent',
            fontSize:11, fontFamily:MONO,
          }}>
            {!slim && <div style={{ width:115, color:'#3f4048', fontSize:10 }}>2024-03-15 {msg.time}</div>}
            {!slim && <div style={{ width:62, color:'#b496f4' }}>{msg.s}</div>}
            {!slim && <div style={{ width:62, color:'#5de0f4' }}>{msg.t}</div>}
            {slim && (
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:9, color:'#3f4048' }}>2024-03-15 {msg.time}</div>
                <span style={{ color:MC[msg.type]||'#aaa', fontWeight:600, fontSize:11 }}>{msg.type}</span>
              </div>
            )}
            {!slim && (
              <div style={{ flex:1, overflow:'hidden' }}>
                <span style={{ color:MC[msg.type]||'#aaa', fontWeight:600 }}>{msg.type}</span>

/* ── Tag inspector panel ── */

    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
      <div style={{ padding:'9px 18px', background:'#202327',
        borderBottom:'1px solid rgba(255,255,255,0.06)', display:'flex', alignItems:'center', flexShrink:0 }}>
        <span style={{ fontSize:13, fontWeight:700, color:TEXT, fontFamily:SANS }}>{title}</span>

          background:'rgba(56,189,248,0.12)', color:'#38bdf8', fontFamily:SANS, fontWeight:600 }}>{msgType}</span>}

          background:'rgba(34,197,94,0.1)', color:GRN, fontFamily:SANS }}>✓ Valid</span>}
        <div style={{ flex:1 }}/>
        <span style={{ fontSize:10, color:'#3a3b42', fontFamily:SANS }}>Skip common fields</span>
      </div>
      {/* Sub-tabs */}
      <div style={{ display:'flex', padding:'0 16px', background:'#1a1b1e',
        borderBottom:'1px solid rgba(255,255,255,0.06)', flexShrink:0 }}>
        {['Table','Raw Text','JSON'].map((t,i)=>(
          <div key={t} style={{ padding:'7px 12px', fontSize:11, fontFamily:SANS,
            fontWeight:i===0?600:400, color:i===0?TEXT:'#484950',
            borderBottom:i===0?`2px solid ${CYAN}`:'2px solid transparent' }}>{t}</div>
        ))}
        <div style={{ flex:1 }}/>
        <input placeholder="Filter by tag, name, value…" style={{ background:'rgba(255,255,255,0.04)',
          border:'1px solid rgba(255,255,255,0.07)', borderRadius:4, padding:'3px 10px',
          fontSize:10, color:'#666', width:220, fontFamily:SANS, marginBottom:4 }}/>
      </div>
      {/* Table */}
      <div style={{ flex:1, overflowY:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:11 }}>
          <thead>
            <tr style={{ background:'#1e2026', color:DIM, fontFamily:SANS }}>
              {['Tag','Tag Description','Value','Value Description'].map(h=>(
                <th key={h} style={{ padding:'5px 14px', textAlign:'left', fontWeight:600,
                  fontSize:10, letterSpacing:'0.4px', whiteSpace:'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {tags.map((tag,i)=>(
              <tr key={i} style={{ background:i%2===0?'transparent':'rgba(255,255,255,0.016)',
                borderBottom:'1px solid rgba(255,255,255,0.028)' }}>
                <td style={{ padding:'4px 14px', color:'#484950', fontFamily:MONO, fontWeight:600 }}>{tag.tag}</td>
                <td style={{ padding:'4px 14px', color:'#a78bfa', fontFamily:MONO }}>{tag.name}</td>
                <td style={{ padding:'4px 14px', color:'#5de0f4', fontFamily:MONO, fontWeight:600 }}>{tag.value}</td>
                <td style={{ padding:'4px 14px', color:'#888', fontFamily:SANS }}>{tag.desc}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}
